<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="robots" content="noindex,nofollow" />
  <title>RALPH</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="auth-stage" aria-live="polite">
    <section class="auth-panel">
      <div class="brand">RALPH</div>

      <div id="bootState" class="state-block">
        <p class="muted">Secure access</p>
        <div class="status">Checking identity…</div>
      </div>

      <form id="loginForm" class="auth-form hidden" autocomplete="on">
        <p class="muted">Secure access</p>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="email" required />
        <button id="signInBtn" class="primary-btn" type="submit">Sign in</button>
        <p id="loginMessage" class="message" role="status"></p>
      </form>

      <section id="authenticatedShell" class="hidden">
        <div class="authenticated-row">
          <div>
            <div class="status-good">Authenticated</div>
            <p id="identityLabel" class="muted identity"></p>
          </div>
          <button id="signOutBtn" class="ghost-btn" type="button">Sign out</button>
        </div>
        <div class="today-placeholder">
          <div class="eyebrow">TODAY</div>
          <h1>Identity established.</h1>
          <p>Business authority remains closed until Phase B.</p>
        </div>
      </section>

      <section id="fatalState" class="hidden">
        <p class="status-error">RALPH authentication is unavailable.</p>
        <p class="muted">No business data has been opened.</p>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
  <script src="/app.js"></script>
</body>
</html>
